backend:
  name: github
  repo: alexpeain/alexpeain.github.io
  branch: main
  base_url: https://decap-oauth-proxy.tonghsengsom.workers.dev
  auth_endpoint: /auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Attachment File", name: "file", widget: "file", required: false }
      - { label: "Hide / Draft Post", name: "draft", widget: "boolean", default: false, required: false }
      
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Engineering", "Tutorials", "Projects", "General", "Books", "Learning", "AI", "Personal"]
        default: "Engineering"
        required: false

      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options: ["python", "django", "jekyll", "decap-cms", "cloudflare", "web-dev", "backend", "career", "self-development", "journaling"]
        default: ["web-dev"]
        required: false

      - { label: "Accent Color", name: "color", widget: "color", default: "#3b82f6", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
